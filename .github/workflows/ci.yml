# Device-free verification for every push and pull request.
#
# Device/emulator runs are intentionally NOT in CI: the WebdriverIO suites need a live
# Android emulator / iOS simulator and stay manual by design (see AGENTS.md). The Node
# version comes from `.nvmrc` (currently 24) via `node-version-file`.
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck, lint, unit, parity, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `verify` chains the device-free checks:
      # typecheck && lint && test:unit && check:parity
      - name: Typecheck, lint, unit tests, twin-parity check
        run: npm run verify

      - name: Format check (prettier)
        run: npm run format:check
